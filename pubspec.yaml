name: shadchan
description: "אפליקציית שידוכים חדשה ב-Flutter."
publish_to: 'none'
version: 1.0.18+38

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  go_router: ^14.8.1
  provider: ^6.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  timezone: ^0.10.1
  flutter_timezone: ^5.0.2
  file_picker: ^8.1.6
  flutter_native_splash: ^2.4.1
  flutter_contacts: ^2.0.2
  kosher_dart: ^2.0.16
  flutter_card_swiper: ^7.0.2
  font_awesome_flutter: ^11.0.0
  excel: ^4.0.6
  archive: ^3.6.1
  path: ^1.9.0

  # On-device face detection, used only to work out where the face sits in a
  # photo so avatars can centre on it instead of cropping it off. Runs locally;
  # no photo ever leaves the device.
  google_mlkit_face_detection: ^0.14.0

  # Firebase. The app stays local-first (Hive): Firebase is only the secure
  # channel to Gemini for the AI import flows — App Check + anonymous auth gate
  # the calls, and no personal data is written to any Firebase product.
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_app_check: ^0.4.4+1
  firebase_ai: ^3.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Logo5.jpeg"

flutter_native_splash:
  color: "#F7F0E4"
  image: "assets/Logo5.jpeg"
  color_dark: "#211D17"
  image_dark: "assets/Logo5.jpeg"
  android_12:
    color: "#F7F0E4"
    color_dark: "#211D17"

flutter:
  uses-material-design: true
  assets:
    - assets/icon4.png
    - assets/match_icon.png
    - assets/male_pic/
    - assets/female_pic/
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
