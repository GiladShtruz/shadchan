name: shadchan
description: "אפליקציית שידוכים חדשה ב-Flutter."
publish_to: 'none'
version: 1.0.19+60
#version: 1.0.0+7

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  go_router: ^14.8.1
  provider: ^6.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  timezone: ^0.10.1
  flutter_timezone: ^5.0.2
  file_picker: ^8.1.6
  flutter_contacts: ^2.0.2
  kosher_dart: ^2.0.16
  flutter_card_swiper: ^7.0.2
  font_awesome_flutter: ^11.0.0
  excel: ^4.0.6
  archive: ^3.6.1
  path: ^1.9.0

  # On-device face detection, used only to work out where the face sits in a
  # photo so avatars can centre on it instead of cropping it off. Runs locally;
  # no photo ever leaves the device.
  google_mlkit_face_detection: ^0.14.0

  # Firebase. The app stays local-first (Hive) — Firebase carries the secure
  # channel to Gemini for the AI import flows, and the identity behind the
  # cloud backup. App Check + auth gate every call.
  #
  # Keep this Firebase family together. `firebase_core 4.12.1` shipped an iOS
  # Pigeon decoder that reads a fifteenth FirebaseOptions field while its
  # allowed `firebase_core_platform_interface 8.1.0` sends only fourteen. The
  # result is an uncaught native NSRangeException (`index 14 beyond bounds
  # [0 .. 13]`) the instant Firebase starts. 4.13.0 realigns iOS, but its App
  # Check pair does not compile with the Android BoM it pins. These are the
  # last mutually compatible releases before that regression; the transitive
  # platform interface is pinned below in `dependency_overrides` because its
  # published `^7.0.1` range would otherwise select the incompatible 7.1.0.
  firebase_core: 4.10.0
  firebase_auth: 6.5.1
  firebase_app_check: 0.4.4+1
  firebase_ai: 3.12.1

  # Signing in with Google, which turns the throwaway anonymous account into
  # one that survives a reinstall or a new phone — the prerequisite for a
  # backup that can actually be restored.
  google_sign_in: ^7.2.0

  # Signing in with Apple, which App Store review requires wherever Google is
  # offered. This package calls `ASAuthorizationAppleIDProvider` — Apple's own
  # sheet, backed by the Runner entitlement. Firebase's dedicated
  # `AppleAuthProvider.credentialWithIDToken` then exchanges its id token and
  # raw nonce. Do not replace this pair with the provider-driven
  # `signInWithProvider(AppleAuthProvider())` web OAuth flow.
  sign_in_with_apple: ^8.1.0

  # The cloud backup. Hive stays the source of truth and the app keeps working
  # with no network at all — Firestore mirrors the database under the signed-in
  # uid, Storage holds the photo files the JSON only ever referenced by path,
  # and `crypto` fingerprints each record so a sync uploads what changed rather
  # than the whole database twice a session.
  # 6.5.0 fixes the iOS SPM Firestore 12.14 bridge initializers and pins the
  # native SDK exactly; 6.4.1 resolves forward to 12.14 but calls its old API.
  cloud_firestore: 6.5.0
  firebase_storage: 13.4.0
  crypto: ^3.0.7
  upgrader: ^13.6.0

  # Only so a problem report can name the version it came from. Already in the
  # tree as an `upgrader` dependency; declared here because the diagnostics
  # import it directly, and a transitive dependency is not a promise.
  package_info_plus: ^9.0.1

  # The other half of a problem report: which phone it came from. `Platform`
  # gives the OS and its version but never the model, and "it doesn't work on
  # my phone" is only actionable once the phone has a name. Read at the moment
  # a report is sent and nowhere else.
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  firebase_core_platform_interface: 7.0.1

# Icon sources live in assets/icon/ and are derived from assets/logo9.png:
# app_icon.png is the artwork bled out to a full square (logo9.png has white
# rounded corners, which both platforms would render as white nubs under their
# own mask), and the adaptive pair keeps the cards inside Android's safe zone
# so the circular/squircle masks can't clip them.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

# The splash screen itself is not generated at build time — flutter_native_splash
# was run once and its output (LaunchScreen storyboard + LaunchBackground assets
# on iOS, launch_background.xml + styles on Android) is committed. The package was
# dropped because it breaks Flutter's Swift Package Manager resolution on CI; put
# it back, with the config block below, if the splash artwork needs regenerating.
#
# `assets/icon/splash_logo.png` is the launch mark: the adaptive pair composited
# — `app_icon_foreground.png` over `app_icon_background.png`, scaled to frame the
# mark exactly as `app_icon.png` does — and then given the same rounded-square
# corner the launcher mask applies, so the tile on the splash and the icon on the
# home screen are the one shape.
#
# Built from the two layers rather than from `app_icon.png` itself for size, not
# looks: the flattened file carries about 15 greyscale levels of film grain,
# which a photograph hides and PNG cannot compress — encoding it cost 1.0 MB per
# copy against 290 KB for the same image built clean, and there are seventeen
# copies. Quantising the flattened version instead was tried and rejected; at 256
# colours the gradient bands visibly on a screen that fills the phone.
#
# The committed bitmaps derived from it — `splash.png` under every Android
# density (light and dark are the same file; the tile carries its own background)
# and the `LaunchImage` set on iOS — are regenerated whenever the icon changes,
# at 256/384/512/768/1024 for mdpi…xxxhdpi and 256/512/768 for 1x/2x/3x.
#
# flutter_native_splash:
#   color: "#F7F0E4"
#   image: "assets/icon/splash_logo.png"
#   color_dark: "#211D17"
#   image_dark: "assets/icon/splash_logo.png"
#   android_12:
#     color: "#F7F0E4"
#     color_dark: "#211D17"

flutter:
  uses-material-design: true
  assets:
    - assets/match_icon.png
    # The app's own mark, alone and on nothing — derived from
    # `assets/icon/app_icon_foreground.png` with the adaptive-icon padding
    # cropped away. Deliberately white: the home bar tints it with a `srcIn`
    # filter, so one file serves the light and the dark theme, and the mark
    # sits directly on the page rather than inside a coloured tile the way the
    # launcher icon does.
    - assets/logo_mark.png
    # The two home entry cards and the tip block's mark. Line drawings on white:
    # black ink on a white ground, tinted at draw time rather than baked — see
    # `HomeLineArt`, which screens the brand tone into the strokes and multiplies
    # the paper tone into the ground, so one file serves the light and the dark
    # theme and the same drawing can wear either card's colour.
    - assets/home_add_people2.png
    - assets/home_add_idea2.png
    - assets/shadchan-tip.png
    - assets/male_pic/
    - assets/female_pic/
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
