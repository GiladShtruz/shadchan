name: shadchan
description: "אפליקציית שידוכים חדשה ב-Flutter."
publish_to: 'none'
version: 1.0.18+46
#version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  go_router: ^14.8.1
  provider: ^6.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  timezone: ^0.10.1
  flutter_timezone: ^5.0.2
  file_picker: ^8.1.6
  flutter_contacts: ^2.0.2
  kosher_dart: ^2.0.16
  flutter_card_swiper: ^7.0.2
  font_awesome_flutter: ^11.0.0
  excel: ^4.0.6
  archive: ^3.6.1
  path: ^1.9.0

  # On-device face detection, used only to work out where the face sits in a
  # photo so avatars can centre on it instead of cropping it off. Runs locally;
  # no photo ever leaves the device.
  google_mlkit_face_detection: ^0.14.0

  # Firebase. The app stays local-first (Hive) — Firebase carries the secure
  # channel to Gemini for the AI import flows, and the identity behind the
  # cloud backup. App Check + auth gate every call.
  #
  # `firebase_core` and `firebase_app_check` are pinned exactly, and must move
  # together. firebase_core 4.13.0 changed a Kotlin signature that App Check
  # 0.4.5+2 calls (`No value passed for parameter 'p0'`), and the App Check
  # 0.4.6 written against it needs a *newer* Firebase Android BoM than 4.13.0
  # pins — its `FlutterFirebaseAppRegistrar` imports an
  # `InternalDebugSecretProvider` that BoM 34.17.0 does not carry, so the whole
  # file drops out and every reference to it goes unresolved. Neither pairing
  # compiles; 4.12.1 + 0.4.5+2 is the last set that does. Everything else in
  # the Firebase family is held below its latest by that pin — check an Android
  # build, not just `flutter pub get`, before raising either.
  firebase_core: 4.12.1
  firebase_auth: ^6.5.1
  firebase_app_check: 0.4.5+2
  firebase_ai: ^3.12.1

  # Signing in with Google, which turns the throwaway anonymous account into
  # one that survives a reinstall or a new phone — the prerequisite for a
  # backup that can actually be restored.
  google_sign_in: ^7.2.0

  # The cloud backup. Hive stays the source of truth and the app keeps working
  # with no network at all — Firestore mirrors the database under the signed-in
  # uid, Storage holds the photo files the JSON only ever referenced by path,
  # and `crypto` fingerprints each record so a sync uploads what changed rather
  # than the whole database twice a session.
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  crypto: ^3.0.7
  upgrader: ^13.6.0

  # Only so a problem report can name the version it came from. Already in the
  # tree as an `upgrader` dependency; declared here because the diagnostics
  # import it directly, and a transitive dependency is not a promise.
  package_info_plus: ^9.0.1

  # The other half of a problem report: which phone it came from. `Platform`
  # gives the OS and its version but never the model, and "it doesn't work on
  # my phone" is only actionable once the phone has a name. Read at the moment
  # a report is sent and nowhere else.
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

# Icon sources live in assets/icon/ and are derived from assets/logo9.png:
# app_icon.png is the artwork bled out to a full square (logo9.png has white
# rounded corners, which both platforms would render as white nubs under their
# own mask), and the adaptive pair keeps the cards inside Android's safe zone
# so the circular/squircle masks can't clip them.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

# The splash screen itself is not generated at build time — flutter_native_splash
# was run once and its output (LaunchScreen storyboard + LaunchBackground assets
# on iOS, launch_background.xml + styles on Android) is committed. The package was
# dropped because it breaks Flutter's Swift Package Manager resolution on CI; put
# it back, with the config block below, if the splash artwork needs regenerating.
#
# flutter_native_splash:
#   color: "#F7F0E4"
#   image: "assets/icon/splash_logo.png"
#   color_dark: "#211D17"
#   image_dark: "assets/icon/splash_logo.png"
#   android_12:
#     color: "#F7F0E4"
#     color_dark: "#211D17"

flutter:
  uses-material-design: true
  assets:
    - assets/match_icon.png
    # The app's own mark, alone and on nothing — derived from
    # `assets/icon/app_icon_foreground.png` with the adaptive-icon padding
    # cropped away. Deliberately white: the home bar tints it with a `srcIn`
    # filter, so one file serves the light and the dark theme, and the mark
    # sits directly on the page rather than inside a coloured tile the way the
    # launcher icon does.
    - assets/logo_mark.png
    # The two home entry cards. Cropped out of a single source illustration to
    # the picture alone — the label the artwork had drawn into it is Flutter
    # text now, so it scales, reads aloud and can be reworded. JPEG rather than
    # PNG on purpose: they are opaque rectangles with painted paper texture, and
    # PNG spent six times the bytes on it.
    - assets/home_add_people.jpg
    - assets/home_add_idea.jpg
    - assets/male_pic/
    - assets/female_pic/
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
