org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 compatibility switches, the same two Flutter's own template and
# migrator write. Most plugins (Firebase, ML Kit, contacts…) still apply the
# separate Kotlin plugin and use the old `android {}` DSL, so both stay off
# until those plugins have moved.
android.newDsl=false
android.builtInKotlin=false
